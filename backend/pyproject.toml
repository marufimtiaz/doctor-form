[project]
name = "doctor-form-backend"
version = "0.1.0"
description = "FastAPI backend for doctor-form"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "boto3>=1.43.79",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "phonenumbers>=9.0.37",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.4",
    "aiosqlite>=0.22.1",
    "asgi-lifespan>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
